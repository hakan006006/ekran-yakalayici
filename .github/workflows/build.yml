name: Build EXE
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pillow mss keyboard pywin32
      - run: pyinstaller --onefile --windowed --name EkranYakalayici ekran_yakalayici.py
      - uses: actions/upload-artifact@v4
        with:
          name: EkranYakalayici
          path: dist/EkranYakalayici.exe
